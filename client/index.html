<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Nuclear Plant Simulator - Multiplayer cooperative reactor management">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nuclear Plant Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #0a0a14; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    #game-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; }

    #loading-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #0a0a14; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 1000;
    }
    #loading-screen h1 { font-family: 'Courier New', monospace; color: #e94560; font-size: 24px; margin-bottom: 20px; }
    #loading-screen .spinner { width: 40px; height: 40px; border: 3px solid #16213e; border-top: 3px solid #4fc3f7; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #reconnect-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 10, 20, 0.88); display: none; flex-direction: column;
      align-items: center; justify-content: center; z-index: 9998; font-family: monospace;
    }
    #reconnect-overlay h2 { color: #4fc3f7; font-size: 20px; margin-bottom: 12px; }
    #reconnect-overlay p { color: #b0b0d0; font-size: 14px; margin-bottom: 16px; }
    #reconnect-overlay .rspin { width: 30px; height: 30px; border: 2px solid #16213e; border-top: 2px solid #4fc3f7; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }

    @media (orientation: portrait) {
      canvas { max-width: 100vw !important; max-height: 50vh !important; }
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>NUCLEAR PLANT SIMULATOR</h1>
    <div class="spinner"></div>
  </div>
  <div id="reconnect-overlay">
    <div class="rspin"></div>
    <h2>Connection Lost</h2>
    <p>Attempting to reconnect...</p>
  </div>
  <div id="game-container"></div>
  <script src="/phaser/phaser.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
